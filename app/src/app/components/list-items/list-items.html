<div class="container mt-4">

  <h2 class="mb-4">
    Items
  </h2>

  @if (items().length === 0) {

    <div class="alert alert-secondary">
      No items found.
    </div>

  } @else {

    <div class="row">

      @for (item of items(); track item._id) {

        <div class="col-md-4 mb-4">

          <div class="card h-100 shadow-sm">

            <img
              [src]="item.image"
              class="card-img-top"
              alt="item image">

            <div class="card-body d-flex flex-column">

              <h5 class="card-title">
                {{ item.title }}
              </h5>

              <p class="card-text">
                {{ item.description }}
              </p>

              <div class="mt-auto">

                <button
                  class="btn btn-primary me-2"
                  (click)="editItem(item)">

                  Edit

                </button>

                <button
                  class="btn btn-danger"
                  (click)="deleteItem(item._id)">

                  Delete

                </button>

              </div>

            </div>

          </div>

        </div>

      }

    </div>

  }

</div>
