<div class="container mt-4">

  @if(itemService.selectedItem()) {

    <div class="card shadow-sm">

      <img
        [src]="itemService.selectedItem()?.image"
        class="card-img-top">

      <div class="card-body">

        <h2>
          {{ itemService.selectedItem()?.title }}
        </h2>

        <p>
          {{ itemService.selectedItem()?.description }}
        </p>

      </div>

    </div>

  }

</div>
